openapi: 3.0.3
info:
  title: Library Service API
  version: 1.0.0
  description: Online management system for book borrowings
paths:
  /api/books/:
    get:
      operationId: books_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - books
      security:
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookList'
          description: ''
    post:
      operationId: books_create
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      security:
      - Authorize: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
  /api/books/{id}/:
    get:
      operationId: books_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this book.
        required: true
      tags:
      - books
      security:
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
    put:
      operationId: books_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this book.
        required: true
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      security:
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
    patch:
      operationId: books_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this book.
        required: true
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookRequest'
      security:
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
    delete:
      operationId: books_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this book.
        required: true
      tags:
      - books
      security:
      - Authorize: []
      responses:
        '204':
          description: No response body
  /api/borrowings/:
    get:
      operationId: borrowings_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - borrowings
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBorrowingListList'
          description: ''
    post:
      operationId: borrowings_create
      description: |-
        Create a new borrowing with proper transaction handling.
        Entire operation is atomic - if payment fails, borrowing is rolled back.
        Users cannot borrow if they have any pending payments.
      tags:
      - borrowings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BorrowingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BorrowingCreateRequest'
        required: true
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowingCreate'
          description: ''
  /api/borrowings/{id}/:
    get:
      operationId: borrowings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - borrowings
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowingDetail'
          description: ''
    put:
      operationId: borrowings_update
      description: |-
        FIX: Allow staff to update certain fields (like expected_return_date).
        Regular users still cannot update.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - borrowings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BorrowingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BorrowingUpdateRequest'
        required: true
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowingUpdate'
          description: ''
    patch:
      operationId: borrowings_partial_update
      description: Allow partial updates with same restrictions as full update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - borrowings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBorrowingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBorrowingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBorrowingUpdateRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowingUpdate'
          description: ''
    delete:
      operationId: borrowings_destroy
      description: 'FIX: Only allow staff to delete, and only if no payments exist'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - borrowings
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '204':
          description: No response body
  /api/borrowings/{id}/return_book/:
    post:
      operationId: borrowings_return_book_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - borrowings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowingDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BorrowingDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BorrowingDetailRequest'
        required: true
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowingDetail'
          description: ''
  /api/borrowings/can_borrow/:
    get:
      operationId: borrowings_can_borrow_retrieve
      description: |-
        Check if the current user can create a new borrowing.
        Returns borrowing eligibility and pending payment details.
      tags:
      - borrowings
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowingDetail'
          description: ''
  /api/payments/:
    get:
      operationId: payments_list
      description: ViewSet for managing payments
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
    post:
      operationId: payments_create
      description: Create a new payment and Stripe checkout session
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
        required: true
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreate'
          description: ''
  /api/payments/{id}/:
    get:
      operationId: payments_retrieve
      description: ViewSet for managing payments
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
          description: ''
    put:
      operationId: payments_update
      description: Prevent direct payment updates - should be handled via webhooks
        or specific actions
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    patch:
      operationId: payments_partial_update
      description: ViewSet for managing payments
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    delete:
      operationId: payments_destroy
      description: Only allow deletion of pending payments
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '204':
          description: No response body
  /api/payments/{id}/check_session/:
    post:
      operationId: payments_check_session_create
      description: Check the status of a Stripe payment session
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{id}/mark_paid/:
    post:
      operationId: payments_mark_paid_create
      description: Manually mark a payment as paid (staff only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{id}/renew_session/:
    post:
      operationId: payments_renew_session_create
      description: |-
        Renew an expired or expiring payment session
        Available to payment owner and staff
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{id}/session_status/:
    get:
      operationId: payments_session_status_retrieve
      description: |-
        Get detailed session status from Stripe
        Available to payment owner and staff
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/bulk_check_sessions/:
    post:
      operationId: payments_bulk_check_sessions_create
      description: |-
        Check session status for multiple payments (staff only)
        Useful for manual verification of payment states
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/cancel/:
    get:
      operationId: payments_cancel_retrieve
      description: Communicate to the user that payment can be made later (session
        valid for 24h)
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          description: No response body
  /api/payments/create_fine_for_borrowing/:
    post:
      operationId: payments_create_fine_for_borrowing_create
      description: Create fine payment for a specific borrowing (staff only)
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/create_test_sessions/:
    post:
      operationId: payments_create_test_sessions_create
      description: Create test Stripe sessions (development only)
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/expired_payments/:
    get:
      operationId: payments_expired_payments_retrieve
      description: Get all expired payments for current user (or all if staff)
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/force_expire_session/:
    post:
      operationId: payments_force_expire_session_create
      description: Manually mark a payment session as expired (staff only, for testing/admin
        purposes)
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/my_fines/:
    get:
      operationId: payments_my_fines_retrieve
      description: Get current user's fine payments
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/my_payments/:
    get:
      operationId: payments_my_payments_retrieve
      description: Get current user's payments
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/renewable_payments/:
    get:
      operationId: payments_renewable_payments_retrieve
      description: Get all renewable payments for current user (expired or pending
        with expired sessions)
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/success/:
    get:
      operationId: payments_success_retrieve
      description: Confirm that the Stripe session was paid and update Payment status
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          description: No response body
  /api/payments/sync_with_stripe/:
    post:
      operationId: payments_sync_with_stripe_create
      description: Check all pending payments against Stripe and update statuses
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/test_webhook/:
    post:
      operationId: payments_test_webhook_create
      description: Test webhook functionality (development only)
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/webhook_events/:
    get:
      operationId: payments_webhook_events_retrieve
      description: Get recent webhook events for debugging (staff only)
      tags:
      - payments
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_me_update
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_me_partial_update
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - Authorize: []
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - Authorize: []
      - Authorize: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/token/:
    post:
      operationId: users_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/users/token/refresh/:
    post:
      operationId: users_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - Authorize: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/token/verify/:
    post:
      operationId: users_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - Authorize: []
      responses:
        '200':
          description: No response body
